<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
// Shot files register themselves in SHOTS: { t0, t1?, fadeIn?, fadeOut?, xfade?, draw(ctx, localT, duration, globalT) }.
// A shot without t1 lasts until the next one starts. OVERLAY(ctx, t), if defined, draws on top of every frame.
// POST, if an episode sets it, adds a film look under the overlay: { drift, bloom, grain, lift, paper } (amounts, 0 = off).
const SHOTS = [];
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
W = +(Q.get('w') || 1920); H = +(Q.get('h') || 1080); cv.width = W; cv.height = H;
const files = Q.get('shots').split(',');
window.ready = (async () => {
  await document.fonts.load('600 40px Inter');
  for (const f of files) await new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = () => rej(new Error('cannot load ' + f));
    document.body.appendChild(s);
  });
  await Promise.all(window.LOADING || []);  // fonts and images a style file started loading
  SHOTS.sort((a, b) => a.t0 - b.t0);
  SHOTS.forEach((s, i) => { if (s.t1 == null) s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : (window.END || 1e9); });
})();

function drawShot(c, s, t) {
  c.save();
  // a breathing camera: slow drift and roll, slightly zoomed in so the edges never show
  const dr = window.POST && POST.drift;
  if (dr) { c.translate(W / 2, H / 2); c.rotate((noise1(t * .23 + 7) - .5) * .006 * dr); c.scale(1 + .014 * dr, 1 + .014 * dr);
    c.translate(-W / 2 + (noise1(t * .31) - .5) * 9 * dr, -H / 2 + (noise1(t * .27 + 3) - .5) * 9 * dr); }
  s.draw(c, t - s.t0, s.t1 - s.t0, t); c.restore();
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none';
}

window.renderAt = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const i = SHOTS.findIndex(s => t >= s.t0 && t < s.t1);
  if (i < 0) { if (window.OVERLAY) OVERLAY(ctx, t); return; }
  const s = SHOTS[i], lt = t - s.t0, d = s.t1 - s.t0;
  window.NOW = t;
  drawShot(ctx, s, t);
  // transition from the previous shot: fade (cross-dissolve), whip (fast slide), flash, zoom, cut
  const tr = s.trans || window.TRANS || 'fade', xf = tr === 'cut' ? 0 : s.xfade ?? (tr === 'fade' ? window.XFADE || 0 : .28);
  if (xf && lt < xf && i > 0) {
    const u = lt / xf, [c2, x2] = scratch('xfade', W, H);
    if (tr !== 'flash') { x2.fillStyle = '#000'; x2.fillRect(0, 0, W, H); drawShot(x2, SHOTS[i - 1], t); }
    if (tr === 'fade') { ctx.save(); ctx.globalAlpha = 1 - u; ctx.drawImage(c2, 0, 0); ctx.restore(); }
    else if (tr === 'whip') {
      const [c3, x3] = scratch('whip', W, H), e = inout(u);
      x3.drawImage(cv, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      for (const k of [0, .04, .08]) {
        ctx.globalAlpha = k ? .25 : 1;
        ctx.drawImage(c2, -e * W - k * W * Math.sin(Math.PI * u), 0); ctx.drawImage(c3, (1 - e) * W - k * W * Math.sin(Math.PI * u), 0);
      }
      ctx.globalAlpha = 1;
    } else if (tr === 'zoom') {
      ctx.save(); ctx.globalAlpha = 1 - u; ctx.translate(W / 2, H / 2); ctx.scale(1 + .6 * u * u, 1 + .6 * u * u); ctx.drawImage(c2, -W / 2, -H / 2); ctx.restore();
    } else if (tr === 'flash') screenFill(ctx, '#fff', 1 - u);
  }
  let k = 0;
  if (s.fadeIn) k = Math.max(k, 1 - lt / s.fadeIn);
  if (s.fadeOut) k = Math.max(k, 1 - (d - lt) / s.fadeOut);
  if (window.POST) post(ctx, t, POST);
  if (k > 0) screenFill(ctx, '#000', Math.min(1, k));
  if (window.OVERLAY) OVERLAY(ctx, t);
};

// Film look: bright parts glow, blacks lift to a deep blue, fine grain that changes every frame.
function post(ctx, t, o) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (o.bloom) {
    const [c, x] = scratch('bloom', W / 4, H / 4);
    x.filter = 'brightness(0.55) contrast(4) saturate(1.4) blur(8px)'; x.drawImage(cv, 0, 0, W / 4, H / 4); x.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = o.bloom; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(c, 0, 0, W, H); ctx.restore();
  }
  if (o.lift) { ctx.save(); ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = o.lift; ctx.fillStyle = '#0d1222'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  if (o.paper) {
    // a still, printed-paper texture: blotches and fibres that do not move
    const tile = env('paper', () => {
      const c = mk(512, 512), x = c.getContext('2d'), im = x.createImageData(512, 512), r = rng(7);
      for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 70; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
      x.putImageData(im, 0, 0);
      for (let k = 0; k < 140; k++) { x.fillStyle = r() < .5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)'; x.beginPath(); x.ellipse(r() * 512, r() * 512, 20 + r() * 70, 10 + r() * 40, r() * 3, 0, Math.PI * 2); x.fill(); }
      return c;
    });
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = o.paper; ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (o.grain) {
    const n = Math.floor(t * 24) % 8, tile = env('grain' + n, () => {
      const c = mk(256, 256), x = c.getContext('2d'), im = x.createImageData(256, 256), r = rng(100 + n);
      for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
      x.putImageData(im, 0, 0); return c;
    });
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = o.grain; ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}
window.frameAt = t => { renderAt(t); return cv.toDataURL('image/jpeg', 0.94).slice(23); };
window.pngAt = t => { renderAt(t); return cv.toDataURL('image/png').slice(22); };
</script>
</body>
</html>
