<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
// Shot files register themselves in SHOTS: { t0, t1, fadeIn?, fadeOut?, draw(ctx, localT, duration, globalT) }.
const SHOTS = [];
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const files = new URLSearchParams(location.search).get('shots').split(',');
window.ready = (async () => {
  await document.fonts.load('600 40px Inter');
  for (const f of files) await new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = () => rej(new Error('cannot load ' + f));
    document.body.appendChild(s);
  });
  SHOTS.sort((a, b) => a.t0 - b.t0);
})();

window.renderAt = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const s = SHOTS.find(s => t >= s.t0 && t < s.t1);
  if (!s) return;
  const lt = t - s.t0, d = s.t1 - s.t0;
  ctx.save(); s.draw(ctx, lt, d, t); ctx.restore();
  let k = 0;
  if (s.fadeIn) k = Math.max(k, 1 - lt / s.fadeIn);
  if (s.fadeOut) k = Math.max(k, 1 - (d - lt) / s.fadeOut);
  if (k > 0) screenFill(ctx, '#000', Math.min(1, k));
};
window.frameAt = t => { renderAt(t); return cv.toDataURL('image/jpeg', 0.94).slice(23); };
window.pngAt = t => { renderAt(t); return cv.toDataURL('image/png').slice(22); };
</script>
</body>
</html>
